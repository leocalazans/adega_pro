<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ofertas</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f7e9bb;color:#1a1510;font-family:Arial,sans-serif}body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(-25deg,transparent 0 34px,#f4df9e 35px 37px);opacity:.6}main{position:relative;min-height:100vh;padding:3vw;display:grid;grid-template-rows:auto 1fr auto;gap:2vw}.mast{background:#d71920;color:white;border:8px solid white;padding:1.6vw 3vw;box-shadow:0 8px #a20d12;display:flex;justify-content:space-between;align-items:center}.mast small{font-weight:900;letter-spacing:.2em}.mast strong{font-size:clamp(1.5rem,4vw,4.6rem);font-style:italic;text-transform:uppercase}.offer{align-self:center;display:grid;grid-template-columns:1fr minmax(260px,.7fr);gap:3vw;align-items:center;transition:.5s}.offer.out{opacity:0;transform:scale(.97)}.tag{display:inline-block;background:#ffcf18;padding:.4em .8em;box-shadow:4px 4px #20170b;font-size:clamp(1rem,2.4vw,2.8rem);font-weight:900}h1{margin:.35em 0 0;font-size:clamp(2.8rem,9vw,10rem);line-height:.85;text-transform:uppercase;letter-spacing:-.07em;text-shadow:4px 4px white}.sub{font-size:clamp(1.1rem,2.5vw,3rem);font-weight:700}.price{background:#d71920;color:white;border:8px solid white;border-radius:50%;width:min(34vw,460px);aspect-ratio:1;display:grid;place-items:center;text-align:center;font-size:clamp(3rem,9vw,10rem);font-weight:900;line-height:.8;box-shadow:0 0 0 8px #d71920,10px 12px rgba(46,20,8,.22);transform:rotate(4deg)}.price span{display:block;font-size:.25em;letter-spacing:.1em;text-transform:uppercase;margin-top:.8em}.foot{display:flex;justify-content:space-between;border-top:3px solid #21180e;padding-top:1vw;font-weight:700}.foot b{color:#d71920}@media(max-width:700px){.offer{grid-template-columns:1fr}.price{width:min(58vw,320px);margin:auto}}</style><main><header class="mast"><small>OFERTAS IMPERDÍVEIS</small><strong>Mercado Bom Vizinho</strong></header><section class="offer" id="offer"><div><span class="tag">OFERTA DA VEZ</span><h1 id="title">Carregando</h1><p class="sub" id="subtitle">Aguarde as promoções</p></div><div class="price" id="price">R$<span>preço especial</span></div></section><footer class="foot"><span>Válido enquanto durarem os estoques</span><b id="status">Conectando ao caixa…</b></footer></main><script>const token=location.pathname.split('/').pop(),endpoint='/api/tv/'+encodeURIComponent(token)+'/promotions',offer=document.getElementById('offer'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),price=document.getElementById('price'),status=document.getElementById('status');let list=[],i=0,delay=10000;function render(){const p=list[i%list.length];offer.classList.add('out');setTimeout(()=>{if(!p){title.textContent='SEM OFERTAS';subtitle.textContent='Cadastre promoções no painel';price.innerHTML='—<span>volte em breve</span>'}else{title.textContent=p.title;subtitle.textContent=p.subtitle||'Preço especial para você';price.innerHTML=(p.price_label||'CONSULTE')+'<span>preço especial</span>'}offer.classList.remove('out')},400);i=(i+1)%list.length}async function load(){try{const r=await fetch(endpoint,{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();delay=Math.max(5000,Math.min(120000,(d.settings?.promotion_interval_seconds||10)*1000));if(JSON.stringify(d.promotions||[])!==JSON.stringify(list)){list=d.promotions||[];i=0;render()}status.textContent='Ofertas atualizadas '+new Date().toLocaleTimeString('pt-BR')}catch(e){status.textContent='Sem conexão com o caixa'}}load();setInterval(load,5000);setInterval(()=>{if(list.length>1)render()},delay);</script>
