[package]
name = "commercectrl-core-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock", "alloc"] }
log = "0.4"
base64 = "0.22"
ed25519-dalek = "2"
