<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D5C3A" />
    <title>CommerceCTRL PDV - Login</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

      :root {
        --primary: #0D5C3A;
        --primary-dark: #0A462A;
        --primary-wash: #E8F3EC;
        --accent: #D4F631;
        --accent-wash: #F3FDE8;
        --paper: #F5F3E9;
        --surface: #ffffff;
        --ink: #1a1e3c;
        --muted: #5b6080;
        --line: #d3d7ec;
        --danger-ink: #e14928;
        --danger-wash: #fff1b5;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; font-family: Inter, system-ui, sans-serif; }

      .access-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(360px, 1.05fr) minmax(440px, .95fr);
        background: var(--paper);
        color: var(--ink);
      }

      .store-rail {
        min-height: 100vh;
        padding: clamp(28px, 5vw, 68px);
        display: flex;
        flex-direction: column;
        background: linear-gradient(135deg, var(--primary-dark), var(--primary));
        color: #fff;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        letter-spacing: -.03em;
        font-family: "Space Grotesk", sans-serif;
      }

      .brand-mark {
        display: inline-grid;
        place-items: center;
        width: 38px;
        height: 32px;
        background: var(--accent);
        color: var(--primary-dark);
        font: 900 17px/1 "Space Grotesk", monospace;
        letter-spacing: -.13em;
        border-radius: 8px;
      }

      .rail-copy {
        max-width: 530px;
        margin: auto;
      }

      .rail-copy p {
        margin: 0;
        color: rgba(255,255,255,.7);
        font-size: 12px;
        font-weight: 750;
        letter-spacing: .05em;
        text-transform: uppercase;
      }

      .rail-copy h1 {
        margin: 14px 0 0;
        font: 700 clamp(42px, 6vw, 78px) / .95 "Space Grotesk", sans-serif;
        letter-spacing: -.075em;
        line-height: .94;
      }

      .status-card {
        display: flex;
        align-items: center;
        gap: 12px;
        width: max-content;
        max-width: 100%;
        padding: 12px 15px;
        background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,255,255,.15);
        border-radius: 12px;
        margin-top: auto;
      }

      .status-card strong { display: block; font-size: 12px; font-weight: 700; }
      .status-card small { margin-top: 3px; color: rgba(255,255,255,.65); font-size: 11px; }

      .pulse {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 5px rgba(212, 246, 49, .25);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: .6; transform: scale(.9); }
      }

      .access-panel {
        align-self: center;
        justify-self: center;
        width: min(440px, calc(100vw - 48px));
        padding: 0 8px;
      }

      .panel-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 48px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .terminal-chip {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--primary);
      }

      .store-context {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 34px;
      }

      .store-seal {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        background: var(--primary-wash);
        color: var(--primary);
        border-radius: 14px;
      }

      .store-context h2 {
        margin: 4px 0 0;
        font: 650 25px/1.05 "Space Grotesk", sans-serif;
        letter-spacing: -.045em;
      }

      .store-context p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      .access-panel form {
        display: grid;
        gap: 18px;
      }

      .access-panel header {
        margin-bottom: 8px;
      }

      .access-panel h3 {
        margin: 0;
        font: 650 32px/1 "Space Grotesk", sans-serif;
        letter-spacing: -.06em;
        color: var(--ink);
      }

      .access-panel header p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .access-panel label {
        display: grid;
        gap: 7px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .input-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        height: 48px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        transition: border-color .15s, box-shadow .15s;
      }

      .input-wrap:focus-within {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(13, 92, 58, .28);
      }

      .input-wrap svg { color: var(--muted); flex-shrink: 0; }
      .input-wrap input {
        flex: 1; height: 100%; border: 0; outline: 0;
        background: transparent; color: var(--ink);
        font: 500 15px Inter, sans-serif;
      }
      .input-wrap input::placeholder { color: var(--line); }

      .error {
        margin: 0;
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--danger-wash);
        color: var(--danger-ink);
        font-size: 13px;
        font-weight: 600;
        border: 1px solid #fecaca;
      }

      .access-panel button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        height: 48px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        font: 700 15px Inter, sans-serif;
        cursor: pointer;
        transition: background .15s, transform .05s;
      }
      .access-panel button:hover:not(:disabled) { background: var(--primary-dark); }
      .access-panel button:active:not(:disabled) { transform: scale(.99); }
      .access-panel button:disabled { opacity: .55; cursor: not-allowed; }

      footer {
        margin-top: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      @media (max-width: 900px) {
        .access-shell { grid-template-columns: 1fr; }
        .store-rail { min-height: auto; padding: clamp(24px, 8vw, 48px); text-align: center; }
        .status-card { margin: 0 auto; }
        .rail-copy { margin: 24px auto 32px; }
        .access-panel { padding: 0 20px 40px; }
      }
    </style>
  </head>
  <body>
    <div class="access-shell">
      <aside class="store-rail" aria-hidden="true">
        <div class="brand">
          <span class="brand-mark">_,CTRL</span>
          <span>CommerceCTRL</span>
        </div>
        <div class="rail-copy">
          <p>operação <span id="conn-status" style="font-weight:700;">verificando…</span></p>
          <h1>Mercadinho Martins</h1>
        </div>
      </aside>

      <section class="access-panel">
        <div class="panel-top">
        </div>

        <form onsubmit="event.preventDefault(); alert('Este é apenas o preview visual. No desktop real, o login usa o Tauri (offline-first).');">
          <header>
            <h3>Entrar no caixa</h3>
            <p>Use as credenciais liberadas pelo administrador da loja.</p>
          </header>
          <label>
            Usuário
            <div class="input-wrap">
              <span style="color:var(--muted); font-size:18px;">&#128100;</span>
              <input autocomplete="username" required placeholder="Usuário" />
            </div>
          </label>
          <label>
            Senha
            <div class="input-wrap">
              <span style="color:var(--muted); font-size:18px;">&#128273;</span>
              <input type="password" autocomplete="current-password" required placeholder="Senha" />
            </div>
          </label>
          <div class="error" id="error" style="display:none;">Usuário ou senha inválidos.</div>
          <button type="submit">Entrar no terminal</button>
          <small class="hint" style="text-align:center; color:var(--muted); font-size:11px;">Primeiro acesso: admin / 123456</small>
        </form>

        <footer style="margin-top: 32px;">
          <span style="color:var(--success); font-size:16px;">&#10004;</span>
          Acesso protegido para esta operação.
        </footer>

        <div style="text-align:center; margin-top: 16px;">
          <span style="color:var(--muted); font-size:11px;">v0.1.2</span>
        </div>
      </section>
    </div>

    <script>
      function atualizarConexao() {
        const el = document.getElementById('conn-status');
        if (!el) return;
        if (navigator.onLine) {
          el.textContent = 'online';
          el.style.color = 'var(--success)';
        } else {
          el.textContent = 'offline';
          el.style.color = 'var(--danger-ink)';
        }
      }
      window.addEventListener('online', atualizarConexao);
      window.addEventListener('offline', atualizarConexao);
      atualizarConexao();

      // Carrega a cor do branding salvo (mesma chave usada pelo app real)
      try {
        const saved = JSON.parse(localStorage.getItem('commercectrl.client.branding') ?? 'null');
        if (saved?.primary_color) {
          const base = saved.primary_color.replace('#', '');
          const r = parseInt(base.substring(0, 2), 16);
          const g = parseInt(base.substring(2, 4), 16);
          const b = parseInt(base.substring(4, 6), 16);
          const darker = `rgb(${Math.max(0, r - 20)},${Math.max(0, g - 20)},${Math.max(0, b - 20)})`;
          document.querySelector('.store-rail').style.background = `linear-gradient(135deg, ${darker}, ${saved.primary_color})`;
        }
      } catch {}
    </script>
  </body>
</html>
